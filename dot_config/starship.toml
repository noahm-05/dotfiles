add_newline = false
format = "$username$hostname$directory$git_branch$git_status$python$custom$cmd_duration$status$character"

[directory]
truncation_length = 3

[username]            # shown only over SSH or as root
format = "[$user]($style)@"
style_user = "bold yellow"

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "bold yellow"

[python]              # shows only inside a venv (no version)
format = "[(\\($virtualenv\\) )]($style)"
style = "cyan"

[cmd_duration]
min_time = 2000

[status]
disabled = false

# optional: VPN IP while tun0 is up (keep or cut after a week)
[custom.tun0]
when = "ip link show tun0 >/dev/null 2>&1"
command = "ip -4 -br addr show tun0 | awk '{sub(/\\/.*/,\"\",$3); print $3}'"
format = "[$output]($style) "
style = "bold blue"
