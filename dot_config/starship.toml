add_newline = false
format = "$username$hostname$directory$git_branch$git_status$python$cmd_duration$status$character"

[directory]
truncation_length = 3

[username]            # shown only over SSH or as root
format = "[$user]($style)@"
style_user = "bold yellow"

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "bold yellow"

[python]              # shows only inside a venv (no version)
format = "[(\\($virtualenv\\) )]($style)"
style = "cyan"

[cmd_duration]
min_time = 2000

[status]
disabled = false
