set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g set-clipboard on           # OSC52: copy in tmux over SSH lands in the local clipboard
set -g allow-passthrough on       # Yazi image previews inside tmux
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# ANSI colors only, so the bar follows the terminal palette
set -g status-style "fg=white,bg=black"
set -g status-left "#S "
set -g status-right "#{?pane_pipe,#[fg=red]● REC#[default] ,}#H"

# prefix+P toggles logging; mkdir happens in the binding itself
bind P run-shell "mkdir -p ~/logs" \; pipe-pane -o 'ansifilter >> ~/logs/$(date +%%F)_#{session_name}-#{window_index}-#{pane_index}.log'
# prefix+T sesh picker (tmux sessions + zoxide dirs)
bind T display-popup -E -w 60% -h 60% 'sesh connect "$(sesh list | fzf --reverse)"'
